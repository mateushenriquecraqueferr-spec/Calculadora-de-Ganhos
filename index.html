<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#1976d2"
    >

    <title>Calculadora de Ganhos</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =====================================================
     TELA DE LOGIN
===================================================== -->

<div
    id="telaLogin"
    class="tela-login"
>

    <div class="login-container">

        <div class="login-logo">
            💰
        </div>

        <h1>
            Calculadora de Ganhos
        </h1>

        <p class="login-subtitulo">
            Entre na sua conta
        </p>


        <!-- LOGIN -->

        <div id="areaLogin">

            <input
                type="email"
                id="emailLogin"
                placeholder="Seu e-mail"
                autocomplete="email"
            >

            <input
                type="password"
                id="senhaLogin"
                placeholder="Sua senha"
                autocomplete="current-password"
            >


            <button
                id="btnLogin"
                class="btn-login"
            >
                🔐 Entrar
            </button>


            <button
                id="btnMostrarCadastro"
                class="btn-secundario"
            >
                📝 Criar conta
            </button>

        </div>


        <!-- CADASTRO -->

        <div
            id="areaCadastro"
            style="display:none;"
        >

            <h2>
                Criar sua conta
            </h2>


            <input
                type="email"
                id="emailCadastro"
                placeholder="Seu e-mail"
                autocomplete="email"
            >


            <input
                type="password"
                id="senhaCadastro"
                placeholder="Crie uma senha"
                autocomplete="new-password"
            >


            <input
                type="password"
                id="senhaCadastroConfirmar"
                placeholder="Confirme sua senha"
                autocomplete="new-password"
            >


            <button
                id="btnCadastro"
                class="btn-login"
            >
                ✅ Criar conta
            </button>


            <button
                id="btnMostrarLogin"
                class="btn-secundario"
            >
                ↩️ Voltar para login
            </button>

        </div>


        <!-- MENSAGEM LOGIN -->

        <div
            id="mensagemLogin"
            class="mensagem-login"
        ></div>


    </div>

</div>



<!-- =====================================================
     APLICATIVO
===================================================== -->

<div
    id="app"
    style="display:none;"
>


    <!-- =================================================
         CABEÇALHO
    ================================================== -->

    <header class="cabecalho">

        <h1>
            💰 Calculadora de Ganhos
        </h1>


        <div
            id="usuarioLogado"
            class="usuario-logado"
        >
            👤 Carregando...
        </div>


        <button
            id="btnSair"
            class="btn-sair"
        >
            🚪 Sair da conta
        </button>

    </header>



    <!-- =================================================
         CONTEÚDO
    ================================================== -->

    <main class="container">


        <!-- =================================================
             FORMULÁRIO
        ================================================== -->

        <section class="card">

            <h2>
                📅 Adicionar ganhos
            </h2>


            <label for="data">
                Data:
            </label>


            <input
                type="date"
                id="data"
            >


            <label for="ganhos">
                Ganhos (R$):
            </label>


            <input
                type="number"
                id="ganhos"
                placeholder="Digite seus ganhos"
                step="0.01"
                min="0"
            >


            <label for="despesas">
                Despesas (R$):
            </label>


            <input
                type="number"
                id="despesas"
                placeholder="Digite suas despesas"
                step="0.01"
                min="0"
            >


            <button
                id="btnAdicionar"
                class="btn-adicionar"
            >
                ➕ Adicionar dia
            </button>


            <!-- STATUS -->

            <div
                id="status"
                class="mensagem"
            ></div>

        </section>



        <!-- =================================================
             RESUMO
        ================================================== -->

        <section class="resumo">

            <h2>
                📊 Resumo geral
            </h2>


            <div class="resumo-item">

                <span>
                    Total de ganhos:
                </span>

                <strong id="totalGanhos">
                    R$ 0,00
                </strong>

            </div>


            <div class="resumo-item">

                <span>
                    Total de despesas:
                </span>

                <strong id="totalDespesas">
                    R$ 0,00
                </strong>

            </div>


            <div class="resumo-item liquido">

                <span>
                    💰 Total líquido:
                </span>

                <strong id="totalLiquido">
                    R$ 0,00
                </strong>

            </div>

        </section>



        <!-- =================================================
             HISTÓRICO
        ================================================== -->

        <section class="card">

            <h2>
                📋 Histórico
            </h2>


            <div
                id="historico"
                class="historico"
            >

                <p style="text-align:center;">
                    Nenhum registro encontrado.
                </p>

            </div>

        </section>


    </main>


</div>



<!-- =====================================================
     FIREBASE AUTHENTICATION
===================================================== -->

<script type="module">

    import {
        initializeApp
    }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {
        getAuth,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    // =================================================
    // CONFIGURAÇÃO FIREBASE
    // =================================================

    const firebaseConfig = {

        apiKey:
            "AIzaSyBuTmt3xy76LzxkPRWoSEy1UI0bJCbuo",

        authDomain:
            "calculadora-de-ganhos-3ed2a.firebaseapp.com",

        projectId:
            "calculadora-de-ganhos-3ed2a",

        storageBucket:
            "calculadora-de-ganhos-3ed2a.firebasestorage.app",

        messagingSenderId:
            "645843187386",

        appId:
            "1:645843187386:web:06928c88dbeeed0f48b483"

    };


    // =================================================
    // APP DE AUTENTICAÇÃO
    // =================================================

    const loginApp =
        initializeApp(
            firebaseConfig,
            "LoginApp"
        );


    const loginAuth =
        getAuth(
            loginApp
        );



    // =================================================
    // ELEMENTOS
    // =================================================

    const telaLogin =
        document.getElementById(
            "telaLogin"
        );


    const app =
        document.getElementById(
            "app"
        );


    const areaLogin =
        document.getElementById(
            "areaLogin"
        );


    const areaCadastro =
        document.getElementById(
            "areaCadastro"
        );


    const btnLogin =
        document.getElementById(
            "btnLogin"
        );


    const btnCadastro =
        document.getElementById(
            "btnCadastro"
        );


    const btnMostrarCadastro =
        document.getElementById(
            "btnMostrarCadastro"
        );


    const btnMostrarLogin =
        document.getElementById(
            "btnMostrarLogin"
        );


    const mensagemLogin =
        document.getElementById(
            "mensagemLogin"
        );


    const usuarioLogado =
        document.getElementById(
            "usuarioLogado"
        );



    // =================================================
    // MENSAGEM
    // =================================================

    function mostrarMensagem(
        texto,
        erro = true
    ) {

        mensagemLogin.textContent =
            texto;


        if (erro) {

            mensagemLogin.style.color =
                "#d32f2f";

        }

        else {

            mensagemLogin.style.color =
                "#2e7d32";

        }

    }



    // =================================================
    // MOSTRAR CADASTRO
    // =================================================

    btnMostrarCadastro.addEventListener(
        "click",
        () => {

            areaLogin.style.display =
                "none";


            areaCadastro.style.display =
                "block";


            mensagemLogin.textContent =
                "";

        }
    );



    // =================================================
    // MOSTRAR LOGIN
    // =================================================

    btnMostrarLogin.addEventListener(
        "click",
        () => {

            areaCadastro.style.display =
                "none";


            areaLogin.style.display =
                "block";


            mensagemLogin.textContent =
                "";

        }
    );



    // =================================================
    // LOGIN
    // =================================================

    btnLogin.addEventListener(
        "click",
        async () => {

            const email =
                document.getElementById(
                    "emailLogin"
                ).value.trim();


            const senha =
                document.getElementById(
                    "senhaLogin"
                ).value;


            if (!email || !senha) {

                mostrarMensagem(
                    "Digite seu e-mail e sua senha."
                );

                return;
            }


            btnLogin.disabled =
                true;


            btnLogin.textContent =
                "Entrando...";


            try {

                await signInWithEmailAndPassword(
                    loginAuth,
                    email,
                    senha
                );


                mostrarMensagem(
                    "✅ Login realizado com sucesso!",
                    false
                );

            }

            catch (erro) {

                console.error(
                    erro
                );


                let mensagem =
                    "❌ E-mail ou senha incorretos.";


                if (
                    erro.code ===
                    "auth/invalid-credential"
                ) {

                    mensagem =
                        "❌ E-mail ou senha incorretos.";

                }


                if (
                    erro.code ===
                    "auth/user-not-found"
                ) {

                    mensagem =
                        "❌ Essa conta não existe.";

                }


                if (
                    erro.code ===
                    "auth/invalid-email"
                ) {

                    mensagem =
                        "❌ E-mail inválido.";

                }


                mostrarMensagem(
                    mensagem
                );

            }


            btnLogin.disabled =
                false;


            btnLogin.textContent =
                "🔐 Entrar";

        }
    );



    // =================================================
    // CRIAR CONTA
    // =================================================

    btnCadastro.addEventListener(
        "click",
        async () => {

            const email =
                document.getElementById(
                    "emailCadastro"
                ).value.trim();


            const senha =
                document.getElementById(
                    "senhaCadastro"
                ).value;


            const confirmar =
                document.getElementById(
                    "senhaCadastroConfirmar"
                ).value;


            if (!email || !senha || !confirmar) {

                mostrarMensagem(
                    "Preencha todos os campos."
                );

                return;
            }


            if (senha !== confirmar) {

                mostrarMensagem(
                    "❌ As senhas não são iguais."
                );

                return;
            }


            if (senha.length < 6) {

                mostrarMensagem(
                    "❌ A senha precisa ter pelo menos 6 caracteres."
                );

                return;
            }


            btnCadastro.disabled =
                true;


            btnCadastro.textContent =
                "Criando conta...";


            try {

                await createUserWithEmailAndPassword(
                    loginAuth,
                    email,
                    senha
                );


                mostrarMensagem(
                    "✅ Conta criada com sucesso!",
                    false
                );


                document.getElementById(
                    "emailCadastro"
                ).value = "";


                document.getElementById(
                    "senhaCadastro"
                ).value = "";


                document.getElementById(
                    "senhaCadastroConfirmar"
                ).value = "";


                // Voltar para login

                setTimeout(
                    () => {

                        areaCadastro.style.display =
                            "none";


                        areaLogin.style.display =
                            "block";

                    },
                    1000
                );

            }

            catch (erro) {

                console.error(
                    erro
                );


                let mensagem =
                    "❌ Não foi possível criar a conta.";


                if (
                    erro.code ===
                    "auth/email-already-in-use"
                ) {

                    mensagem =
                        "❌ Este e-mail já possui uma conta.";

                }


                if (
                    erro.code ===
                    "auth/invalid-email"
                ) {

                    mensagem =
                        "❌ E-mail inválido.";

                }


                if (
                    erro.code ===
                    "auth/weak-password"
                ) {

                    mensagem =
                        "❌ A senha é muito fraca.";

                }


                mostrarMensagem(
                    mensagem
                );

            }


            btnCadastro.disabled =
                false;


            btnCadastro.textContent =
                "✅ Criar conta";

        }
    );



    // =================================================
    // VERIFICAR LOGIN
    // =================================================

    onAuthStateChanged(
        loginAuth,
        (user) => {

            if (user) {

                // =====================================
                // USUÁRIO LOGADO
                // =====================================

                telaLogin.style.display =
                    "none";


                app.style.display =
                    "block";


                usuarioLogado.innerHTML =
                    `
                    👤 Logado como:
                    <strong>
                        ${user.email}
                    </strong>
                    `;


                console.log(
                    "Usuário autenticado:",
                    user.email
                );


                console.log(
                    "UID:",
                    user.uid
                );

            }

            else {

                // =====================================
                // NÃO LOGADO
                // =====================================

                telaLogin.style.display =
                    "flex";


                app.style.display =
                    "none";


                usuarioLogado.innerHTML =
                    "👤 Não conectado";

            }

        }
    );

</script>



<!-- =====================================================
     SCRIPT PRINCIPAL DO APP
===================================================== -->

<script
    type="module"
    src="script.js"
></script>


</body>

</html>
